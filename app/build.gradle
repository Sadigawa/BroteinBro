plugins {
    id 'com.android.application'
}

android {
    namespace 'com.broteinbro.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.broteinbro.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
